name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import smoke check
        run: |
          python -c "import app"
          python -c "import services.nws_api, services.open_meteo, services.nomads, services.radar, services.stations"
          python -c "import utils.geospatial, utils.units, utils.labels"

      - name: Run tests
        run: pytest
